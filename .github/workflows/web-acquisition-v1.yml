name: Web Acquisition v1

on:
  push:
    branches:
      - feat/web-acquisition-layer-v1
    paths:
      - "packages/web-acquisition/**"
      - ".github/workflows/web-acquisition-v1.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web-acquisition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/web-acquisition/pyproject.toml
      - name: Install package and fetchers
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,scrapling]"
      - name: Install Scrapling browser runtime
        run: scrapling install
      - name: Unit tests
        run: pytest -q
      - name: Maistio WordPress structured parity
        run: |
          set -o pipefail
          python scripts/maistio_wp_structured_parity_v1.py | tee wp-parity-results.json
      - name: Maistio shadow canary
        run: |
          set -o pipefail
          python scripts/maistio_shadow_canary_v1.py | tee shadow-canary-results.json
      - name: Upload Maistio acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maistio-web-acquisition-v1
          path: |
            packages/web-acquisition/wp-parity-results.json
            packages/web-acquisition/shadow-canary-results.json
